apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-order-web
  labels:
    app.kubernetes.io/name: ticket-order-web
    app.kubernetes.io/part-of: ticket-order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-order-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-order-web
        app.kubernetes.io/part-of: ticket-order-platform
    spec:
      containers:
        - name: web
          image: ticket-order-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
