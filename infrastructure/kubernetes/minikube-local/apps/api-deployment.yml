apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-order-api
  labels:
    app.kubernetes.io/name: ticket-order-api
    app.kubernetes.io/part-of: ticket-order-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-order-api
        app.kubernetes.io/part-of: ticket-order-platform
    spec:
      containers:
        - name: api
          image: ticket-order-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: ticket-order-config
                  key: spring-datasource-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ticket-order-postgres
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-order-postgres
                  key: password
            - name: TICKET_ORDER_PLATFORM_CORS_ALLOWED_ORIGINS
              value: http://localhost:30080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
