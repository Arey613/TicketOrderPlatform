apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ticket-order-postgres
  labels:
    app.kubernetes.io/name: ticket-order-postgres
    app.kubernetes.io/part-of: ticket-order-platform
spec:
  serviceName: ticket-order-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ticket-order-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ticket-order-postgres
        app.kubernetes.io/part-of: ticket-order-platform
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ticket-order-config
                  key: database-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ticket-order-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticket-order-postgres
                  key: password
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
