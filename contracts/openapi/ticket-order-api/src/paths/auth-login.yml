---
post:
  operationId: login
  tags:
  - Auth
  summary: Authenticate a user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          "$ref": "#/components/schemas/LoginRequest"
  responses:
    '200':
      description: Login succeeded
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/LoginResponse"
    '400':
      description: Login request was invalid
    '401':
      description: Login credentials are unknown, invalid, or disabled
