---
"/orders/mine":
  get:
    operationId: listMyOrders
    tags:
      - Orders
    summary: List orders for the current customer
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/PageParameter"
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      - "$ref": "#/components/parameters/SortParameter"
    responses:
      "200":
        description: Customer orders response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MyOrdersResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
