---
"/events":
  post:
    operationId: createEvent
    tags:
      - Events
    summary: Create an event
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateEventRequest"
    responses:
      "201":
        description: Event was created
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
  get:
    operationId: listEvents
    tags:
      - Events
    summary: List events
    security:
      - sessionAuth: []
    parameters:
      - name: scope
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/EventListScope"
      - "$ref": "#/components/parameters/PageParameter"
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
      - "$ref": "#/components/parameters/SortParameter"
    responses:
      "200":
        description: Events response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventListResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
"/public/events":
  get:
    operationId: listPublishedEvents
    tags:
      - Events
    summary: List published events for public browsing
    parameters:
      - "$ref": "#/components/parameters/PageParameter"
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 10
      - "$ref": "#/components/parameters/SortParameter"
    responses:
      "200":
        description: Published events response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventListResponse"
"/public/events/{eventId}":
  get:
    operationId: getPublishedEvent
    tags:
      - Events
    summary: Return a published event for public browsing
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Published event response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "404":
        "$ref": "#/components/responses/NotFound"
"/events/{eventId}":
  get:
    operationId: getEvent
    tags:
      - Events
    summary: Return an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Event response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
  put:
    operationId: updateEvent
    tags:
      - Events
    summary: Update an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateEventRequest"
    responses:
      "200":
        description: Event was updated
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
  patch:
    operationId: patchEvent
    tags:
      - Events
    summary: Patch a draft event
    description: >-
      Partially updates scalar event fields and details for an owned draft event.
      Omitted fields and explicit null values keep the existing value; clearing
      optional fields is not supported by this operation.
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/PatchEventRequest"
    responses:
      "200":
        description: Event was patched
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
"/events/{eventId}/image":
  post:
    operationId: attachEventImage
    tags:
      - Events
    summary: Attach an image to an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - image
            properties:
              image:
                type: string
                format: binary
    responses:
      "200":
        description: Image was attached
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "413":
        "$ref": "#/components/responses/PayloadTooLarge"
"/events/{eventId}/video-upload-url":
  post:
    operationId: issueEventVideoUploadUrl
    tags:
      - Events
    summary: Issue a presigned URL for uploading an event video directly to storage
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/IssueVideoUploadUrlRequest"
    responses:
      "201":
        description: Upload URL was issued
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IssueVideoUploadUrlResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
"/events/{eventId}/video-upload-confirmation":
  post:
    operationId: confirmEventVideoUpload
    tags:
      - Events
    summary: Confirm a previously issued event video upload completed successfully
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ConfirmVideoUploadRequest"
    responses:
      "200":
        description: Video upload was confirmed
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
"/events/{eventId}/publish":
  post:
    operationId: publishEvent
    tags:
      - Events
    summary: Publish an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Event was published
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
"/events/{eventId}/unpublish":
  post:
    operationId: unpublishEvent
    tags:
      - Events
    summary: Unpublish an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Event was unpublished
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
