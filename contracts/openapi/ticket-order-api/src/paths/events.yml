---
"/events":
  post:
    operationId: createEvent
    tags:
      - Events
    summary: Create an event
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateEventRequest"
    responses:
      "201":
        description: Event was created
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
  get:
    operationId: listEvents
    tags:
      - Events
    summary: List events
    security:
      - sessionAuth: []
    parameters:
      - name: scope
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/EventListScope"
    responses:
      "200":
        description: Events response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventListResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
"/public/events":
  get:
    operationId: listPublishedEvents
    tags:
      - Events
    summary: List published events for public browsing
    responses:
      "200":
        description: Published events response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventListResponse"
"/public/events/{eventId}":
  get:
    operationId: getPublishedEvent
    tags:
      - Events
    summary: Return a published event for public browsing
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Published event response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "404":
        "$ref": "#/components/responses/NotFound"
"/events/{eventId}":
  get:
    operationId: getEvent
    tags:
      - Events
    summary: Return an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Event response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
  put:
    operationId: updateEvent
    tags:
      - Events
    summary: Update an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/UpdateEventRequest"
    responses:
      "200":
        description: Event was updated
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
"/events/{eventId}/publish":
  post:
    operationId: publishEvent
    tags:
      - Events
    summary: Publish an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Event was published
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
"/events/{eventId}/unpublish":
  post:
    operationId: unpublishEvent
    tags:
      - Events
    summary: Unpublish an event
    security:
      - sessionAuth: []
    parameters:
      - "$ref": "#/components/parameters/EventId"
    responses:
      "200":
        description: Event was unpublished
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EventResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
