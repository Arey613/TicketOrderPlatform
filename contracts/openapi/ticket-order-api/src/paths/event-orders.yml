---
"/events/orders":
  post:
    operationId: createEventOrders
    tags:
      - Events
    summary: Create event orders
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/CreateEventOrdersRequest"
    responses:
      "201":
        description: Event orders were created
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatedEventOrdersResponse"
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "404":
        "$ref": "#/components/responses/NotFound"
      "409":
        "$ref": "#/components/responses/Conflict"
  delete:
    operationId: deleteEventOrders
    tags:
      - Events
    summary: Delete event orders
    security:
      - sessionAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/DeleteEventOrdersRequest"
    responses:
      "204":
        description: Event orders were deleted
      "400":
        "$ref": "#/components/responses/BadRequest"
      "401":
        "$ref": "#/components/responses/Unauthorized"
      "403":
        "$ref": "#/components/responses/Forbidden"
      "404":
        "$ref": "#/components/responses/NotFound"
"/events/orders/mine":
  get:
    operationId: listMyEventOrders
    tags:
      - Events
    summary: List event orders for the current user
    security:
      - sessionAuth: []
    responses:
      "200":
        description: Event orders response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MyEventOrdersResponse"
      "401":
        "$ref": "#/components/responses/Unauthorized"
