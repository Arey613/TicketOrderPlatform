---
"/users/{userId}":
  get:
    operationId: getUser
    tags:
    - Users
    summary: Return a user
    security:
    - sessionAuth: []
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    responses:
      '200':
        description: User response
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserResponse"
      '401':
        description: Authentication credentials are missing or invalid
      '404':
        description: User was not found
