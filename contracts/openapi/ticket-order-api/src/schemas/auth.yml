---
LoginRequest:
  type: object
  required:
    - login
    - password
  properties:
    login:
      type: string
      format: email
      maxLength: 320
    password:
      type: string
      minLength: 1
RegisterUserRequest:
  type: object
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      maxLength: 320
    password:
      type: string
      minLength: 8
      maxLength: 128
LoginResponse:
  type: object
  required:
    - id
    - email
    - role
    - enabled
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
      maxLength: 320
    role:
      "$ref": "#/components/schemas/UserRole"
    enabled:
      type: boolean
ErrorResponse:
  type: object
  required:
    - code
    - message
    - timestamp
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 100
    message:
      type: string
      minLength: 1
      maxLength: 500
    fieldErrors:
      type: array
      items:
        "$ref": "#/components/schemas/FieldErrorResponse"
    timestamp:
      type: string
      format: date-time
FieldErrorResponse:
  type: object
  required:
    - field
    - message
  properties:
    field:
      type: string
      minLength: 1
      maxLength: 200
    message:
      type: string
      minLength: 1
      maxLength: 500
