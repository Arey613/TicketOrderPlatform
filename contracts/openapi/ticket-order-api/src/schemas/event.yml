---
EventId:
  name: eventId
  in: path
  required: true
  schema:
    type: string
    format: uuid
EventStatus:
  type: string
  enum:
    - DRAFT
    - PUBLISHED
    - CANCELLED
EventListScope:
  type: string
  default: published
  enum:
    - published
    - mine
EventDetailsRequest:
  type: object
  required:
    - description
    - numberOfPlaces
    - numberOfRows
    - seatsPerRow
  properties:
    description:
      type: string
      minLength: 1
    numberOfPlaces:
      type: integer
      minimum: 1
    numberOfRows:
      type: integer
      minimum: 1
    seatsPerRow:
      type: integer
      minimum: 1
    placeTypes:
      type: array
      items:
        "$ref": "#/components/schemas/EventPlaceTypeRequest"
EventDetailsResponse:
  allOf:
    - "$ref": "#/components/schemas/EventDetailsRequest"
    - type: object
      required:
        - availablePlaces
      properties:
        availablePlaces:
          type: integer
          minimum: 0
EventPlaceTypeRequest:
  type: object
  required:
    - name
    - price
    - currency
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    price:
      type: string
      pattern: "^\\d+(\\.\\d{1,2})?$"
    currency:
      type: string
      minLength: 3
      maxLength: 3
CreateEventRequest:
  type: object
  required:
    - name
    - date
    - place
    - type
    - details
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
    date:
      type: string
      format: date-time
    place:
      type: string
      minLength: 1
      maxLength: 200
    city:
      type: string
      maxLength: 120
    type:
      type: string
      minLength: 1
      maxLength: 100
    summary:
      type: string
      maxLength: 500
    imageUrl:
      type: string
      format: uri
    price:
      type: string
      pattern: "^\\d+(\\.\\d{1,2})?$"
    currency:
      type: string
      minLength: 3
      maxLength: 3
    details:
      "$ref": "#/components/schemas/EventDetailsRequest"
  additionalProperties: false
UpdateEventRequest:
  allOf:
    - "$ref": "#/components/schemas/CreateEventRequest"
BookedPlaceResponse:
  type: object
  required:
    - row
    - place
  properties:
    row:
      type: integer
      minimum: 1
    place:
      type: integer
      minimum: 1
    isMine:
      type: boolean
      description: Present only when ownership is projected for an authenticated viewer.
EventResponse:
  type: object
  required:
    - eventId
    - ownerId
    - name
    - date
    - place
    - type
    - status
    - details
    - ordersTaken
    - availablePlaces
    - takenPlaces
  properties:
    eventId:
      type: string
      format: uuid
    ownerId:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 200
    date:
      type: string
      format: date-time
    place:
      type: string
      maxLength: 200
    city:
      type: string
      maxLength: 120
    type:
      type: string
      maxLength: 100
    summary:
      type: string
      maxLength: 500
    imageUrl:
      type: string
      format: uri
    price:
      type: string
      pattern: "^\\d+(\\.\\d{1,2})?$"
    currency:
      type: string
      minLength: 3
      maxLength: 3
    status:
      "$ref": "#/components/schemas/EventStatus"
    details:
      "$ref": "#/components/schemas/EventDetailsResponse"
    ordersTaken:
      type: integer
      minimum: 0
    availablePlaces:
      type: integer
      minimum: 0
    takenPlaces:
      type: array
      items:
        "$ref": "#/components/schemas/BookedPlaceResponse"
EventListResponse:
  type: object
  required:
    - events
  properties:
    events:
      type: array
      items:
        "$ref": "#/components/schemas/EventResponse"
