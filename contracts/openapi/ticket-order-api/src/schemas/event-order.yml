---
CreateEventOrderItem:
  type: object
  required:
    - eventId
    - row
    - place
    - placeType
  properties:
    eventId:
      type: string
      format: uuid
    row:
      type: integer
      minimum: 1
    place:
      type: integer
      minimum: 1
    placeType:
      type: string
      minLength: 1
      maxLength: 100
CreateEventOrdersRequest:
  type: object
  required:
    - orders
  properties:
    orders:
      type: array
      minItems: 1
      items:
        "$ref": "#/components/schemas/CreateEventOrderItem"
CreatedEventOrderResponse:
  type: object
  required:
    - eventOrderId
    - eventId
    - row
    - place
    - placeType
    - reservationDate
  properties:
    eventOrderId:
      type: string
      format: uuid
    eventId:
      type: string
      format: uuid
    row:
      type: integer
      minimum: 1
    place:
      type: integer
      minimum: 1
    placeType:
      type: string
      maxLength: 100
    reservationDate:
      type: string
      format: date-time
CreatedEventOrdersResponse:
  type: object
  required:
    - orders
  properties:
    orders:
      type: array
      items:
        "$ref": "#/components/schemas/CreatedEventOrderResponse"
DeleteEventOrdersRequest:
  type: object
  required:
    - eventOrderIds
  properties:
    eventOrderIds:
      type: array
      minItems: 1
      items:
        type: string
        format: uuid
MyEventOrderResponse:
  type: object
  required:
    - eventOrderId
    - eventId
    - eventName
    - eventDate
    - row
    - place
    - placeType
    - reservationDate
  properties:
    eventOrderId:
      type: string
      format: uuid
    eventId:
      type: string
      format: uuid
    eventName:
      type: string
      maxLength: 200
    eventDate:
      type: string
      format: date-time
    row:
      type: integer
      minimum: 1
    place:
      type: integer
      minimum: 1
    placeType:
      type: string
      maxLength: 100
    reservationDate:
      type: string
      format: date-time
MyEventOrdersResponse:
  type: object
  required:
    - items
    - page
  properties:
    items:
      type: array
      items:
        "$ref": "#/components/schemas/MyEventOrderResponse"
    page:
      "$ref": "#/components/schemas/PageMetadata"
