---
UserRole:
  type: string
  enum:
  - CUSTOMER
  - MANAGER
  - ADMIN
UserResponse:
  type: object
  required:
  - id
  - email
  - role
  - enabled
  - createdAt
  - updatedAt
  properties:
    id:
      type: string
      format: uuid
    email:
      type: string
      format: email
      maxLength: 320
    role:
      "$ref": "#/components/schemas/UserRole"
    enabled:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
