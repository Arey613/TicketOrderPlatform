---
type: object
required:
- eventOrderId
- eventId
- eventName
- eventDate
- row
- place
- placeType
- reservationDate
properties:
  eventOrderId:
    type: string
    format: uuid
  eventId:
    type: string
    format: uuid
  eventName:
    type: string
    maxLength: 200
  eventDate:
    type: string
    format: date-time
  row:
    type: integer
    minimum: 1
  place:
    type: integer
    minimum: 1
  placeType:
    type: string
    maxLength: 100
  reservationDate:
    type: string
    format: date-time
