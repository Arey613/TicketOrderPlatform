---
type: object
required:
- eventId
- row
- place
- placeType
properties:
  eventId:
    type: string
    format: uuid
  customerReference:
    type: string
    format: uuid
  row:
    type: integer
    minimum: 1
  place:
    type: integer
    minimum: 1
  placeType:
    type: string
    minLength: 1
    maxLength: 100
