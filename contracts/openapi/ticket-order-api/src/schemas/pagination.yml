---
PageParameter:
  name: page
  in: query
  required: false
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0
SortParameter:
  name: sort
  in: query
  required: false
  schema:
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9]*(,(asc|desc))?$"
PageMetadata:
  type: object
  required:
    - number
    - size
    - totalElements
    - totalPages
    - first
    - last
  properties:
    number:
      type: integer
      format: int32
      minimum: 0
    size:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
    totalElements:
      type: integer
      format: int64
      minimum: 0
    totalPages:
      type: integer
      format: int32
      minimum: 0
    first:
      type: boolean
    last:
      type: boolean
