openapi: 3.1.0
info:
  title: Ticket Service API
  version: 0.1.0
  description: API contract for the TicketOrderPlatform ticket service.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: Health
    description: Basic service responses
  - name: Users
    description: User resources
paths:
  /hello:
    get:
      operationId: getGreeting
      tags:
        - Health
      summary: Return a greeting
      responses:
        "200":
          description: Greeting response
          content:
            text/plain:
              schema:
                type: string
                example: Hello, World!
  /users/{userId}:
    get:
      operationId: getUser
      tags:
        - Users
      summary: Return a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User was not found
components:
  schemas:
    UserRole:
      type: string
      enum:
        - CUSTOMER
        - ADMIN
    UserResponse:
      type: object
      required:
        - id
        - email
        - role
        - enabled
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 320
        role:
          $ref: "#/components/schemas/UserRole"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
