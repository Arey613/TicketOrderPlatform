---
openapi: 3.1.0
info:
  title: Ticket Service API
  version: 0.1.0
  description: API contract for the TicketOrderPlatform ticket service.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: Auth
    description: Registration, login, and logout resources
  - name: Users
    description: User resources
  - name: Events
    description: Event management and event order resources
  - name: Orders
    description: Customer order resources
paths:
  "/auth/csrf":
    get:
      operationId: getCsrfToken
      tags:
        - Auth
      summary: Create a CSRF token cookie
      responses:
        "204":
          description: CSRF token cookie was created
  "/auth/login":
    post:
      operationId: login
      tags:
        - Auth
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/auth/register":
    post:
      operationId: registerUser
      tags:
        - Auth
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Registration succeeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/auth/logout":
    post:
      operationId: logout
      tags:
        - Auth
      summary: Logout the current user
      responses:
        "204":
          description: Logout succeeded
  "/users/{userId}":
    get:
      operationId: getUser
      tags:
        - Users
      summary: Return a user
      security:
        - sessionAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/events":
    post:
      operationId: createEvent
      tags:
        - Events
      summary: Create an event
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event was created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
    get:
      operationId: listEvents
      tags:
        - Events
      summary: List events
      security:
        - sessionAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            "$ref": "#/components/schemas/EventListScope"
        - "$ref": "#/components/parameters/PageParameter"
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - "$ref": "#/components/parameters/SortParameter"
      responses:
        "200":
          description: Events response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventListResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/events/{eventId}":
    get:
      operationId: getEvent
      tags:
        - Events
      summary: Return an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Event response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
    put:
      operationId: updateEvent
      tags:
        - Events
      summary: Update an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Event was updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    patch:
      operationId: patchEvent
      tags:
        - Events
      summary: Patch a draft event
      description: >-
        Partially updates scalar event fields and details for an owned draft event.
        Omitted fields and explicit null values keep the existing value; clearing
        optional fields is not supported by this operation.
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PatchEventRequest"
      responses:
        "200":
          description: Event was patched
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/public/events":
    get:
      operationId: listPublishedEvents
      tags:
        - Events
      summary: List published events for public browsing
      parameters:
        - "$ref": "#/components/parameters/PageParameter"
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 10
        - "$ref": "#/components/parameters/SortParameter"
      responses:
        "200":
          description: Published events response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventListResponse"
  "/public/events/{eventId}":
    get:
      operationId: getPublishedEvent
      tags:
        - Events
      summary: Return a published event for public browsing
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Published event response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/events/{eventId}/publish":
    post:
      operationId: publishEvent
      tags:
        - Events
      summary: Publish an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Event was published
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/events/{eventId}/unpublish":
    post:
      operationId: unpublishEvent
      tags:
        - Events
      summary: Unpublish an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Event was unpublished
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/events/{eventId}/image":
    post:
      operationId: attachEventImage
      tags:
        - Events
      summary: Attach an image to an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Image was attached
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "413":
          "$ref": "#/components/responses/PayloadTooLarge"
  "/events/{eventId}/video-upload-url":
    post:
      operationId: issueEventVideoUploadUrl
      tags:
        - Events
      summary: Issue a presigned URL for uploading an event video directly to storage
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/IssueVideoUploadUrlRequest"
      responses:
        "201":
          description: Upload URL was issued
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/IssueVideoUploadUrlResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/events/{eventId}/video-upload-confirmation":
    post:
      operationId: confirmEventVideoUpload
      tags:
        - Events
      summary: Confirm a previously issued event video upload completed successfully
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ConfirmVideoUploadRequest"
      responses:
        "200":
          description: Video upload was confirmed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/events/orders":
    post:
      operationId: createEventOrders
      tags:
        - Events
      summary: Create event orders
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateEventOrdersRequest"
      responses:
        "201":
          description: Event orders were created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedEventOrdersResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
    delete:
      operationId: deleteEventOrders
      tags:
        - Events
      summary: Delete event orders
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeleteEventOrdersRequest"
      responses:
        "204":
          description: Event orders were deleted
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/orders/mine":
    get:
      operationId: listMyOrders
      tags:
        - Orders
      summary: List orders for the current customer
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/PageParameter"
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - "$ref": "#/components/parameters/SortParameter"
      responses:
        "200":
          description: Customer orders response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MyOrdersResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParameter:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    SortParameter:
      name: sort
      in: query
      required: false
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9]*(,(asc|desc))?$"
  responses:
    BadRequest:
      description: Request was invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    # TODO: review these shared error responses (BadRequest, Unauthorized, Forbidden, NotFound,
    # Conflict, PayloadTooLarge) to make them more generic/consistent across the whole API,
    # rather than growing new one-off response definitions per endpoint.
    PayloadTooLarge:
      description: Uploaded file exceeds the allowed size limit
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
    RegisterUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginResponse:
      type: object
      required:
        - id
        - email
        - role
        - enabled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 320
        role:
          "$ref": "#/components/schemas/UserRole"
        enabled:
          type: boolean
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldErrors:
          type: array
          items:
            "$ref": "#/components/schemas/FieldErrorResponse"
        timestamp:
          type: string
          format: date-time
    FieldErrorResponse:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 500
    UserRole:
      type: string
      enum:
      - CUSTOMER
      - MANAGER
      - ADMIN
    EventStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - CANCELLED
    EventListScope:
      type: string
      default: published
      enum:
        - published
        - mine
    PageMetadata:
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
        - first
        - last
      properties:
        number:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          format: int32
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean
    EventDetailsRequest:
      type: object
      required:
        - description
        - numberOfPlaces
        - numberOfRows
        - seatsPerRow
      properties:
        description:
          type: string
          minLength: 1
        numberOfPlaces:
          type: integer
          minimum: 1
        numberOfRows:
          type: integer
          minimum: 1
        seatsPerRow:
          type: integer
          minimum: 1
        placeTypes:
          type: array
          items:
            "$ref": "#/components/schemas/EventPlaceTypeRequest"
    EventDetailsResponse:
      allOf:
        - "$ref": "#/components/schemas/EventDetailsRequest"
        - type: object
          required:
            - availablePlaces
          properties:
            availablePlaces:
              type: integer
              minimum: 0
    EventPlaceTypeRequest:
      type: object
      required:
        - name
        - price
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,2})?$"
        currency:
          type: string
          minLength: 3
          maxLength: 3
    CreateEventRequest:
      type: object
      required:
        - name
        - date
        - place
        - type
        - details
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date-time
        place:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          maxLength: 120
        type:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          maxLength: 500
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,2})?$"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        details:
          "$ref": "#/components/schemas/EventDetailsRequest"
      additionalProperties: false
    UpdateEventRequest:
      allOf:
        - "$ref": "#/components/schemas/CreateEventRequest"
    PatchEventDetailsRequest:
      type: object
      description: >-
        Partial event detail update. Omitted fields and explicit null values keep
        the existing value; clearing optional fields is out of scope.
      properties:
        description:
          type: string
          nullable: true
          minLength: 1
        numberOfPlaces:
          type: integer
          nullable: true
          minimum: 1
        numberOfRows:
          type: integer
          nullable: true
          minimum: 1
        seatsPerRow:
          type: integer
          nullable: true
          minimum: 1
        placeTypes:
          type: array
          nullable: true
          items:
            "$ref": "#/components/schemas/EventPlaceTypeRequest"
      additionalProperties: false
    PatchEventRequest:
      type: object
      description: >-
        Partial event update. Omitted fields and explicit null values keep the
        existing value; clearing optional fields is out of scope.
      properties:
        name:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
        date:
          type: string
          nullable: true
          format: date-time
        place:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
        type:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        details:
          nullable: true
          "$ref": "#/components/schemas/PatchEventDetailsRequest"
      additionalProperties: false
    BookedPlaceResponse:
      type: object
      required:
        - row
        - place
      properties:
        row:
          type: integer
          minimum: 1
        place:
          type: integer
          minimum: 1
        isMine:
          type: boolean
          description: Present only when ownership is projected for an authenticated viewer.
    EventResponse:
      type: object
      required:
        - eventId
        - ownerId
        - name
        - date
        - place
        - type
        - status
        - details
        - ordersTaken
        - availablePlaces
        - takenPlaces
      properties:
        eventId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        date:
          type: string
          format: date-time
        place:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        type:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri
          description: >-
            Public object URL for the event's attached image, present only once
            an image has been uploaded.
        videoUrl:
          type: string
          format: uri
          description: >-
            Public object URL for the event's attached video, present only once
            a video has been uploaded.
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,2})?$"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          "$ref": "#/components/schemas/EventStatus"
        details:
          "$ref": "#/components/schemas/EventDetailsResponse"
        ordersTaken:
          type: integer
          minimum: 0
        availablePlaces:
          type: integer
          minimum: 0
        takenPlaces:
          type: array
          items:
            "$ref": "#/components/schemas/BookedPlaceResponse"
    EventListResponse:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            "$ref": "#/components/schemas/EventResponse"
        page:
          "$ref": "#/components/schemas/PageMetadata"
    IssueVideoUploadUrlRequest:
      type: object
      required:
        - fileName
        - contentType
        - fileSizeBytes
        - sha256
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          type: string
          enum:
            - video/mp4
            - video/webm
            - video/quicktime
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
          description: >-
            Exact byte size of the video file. Signed into the presigned upload URL so
            object storage rejects an upload whose actual size does not match.
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase hexadecimal SHA-256 checksum of the video file.
      additionalProperties: false
    IssueVideoUploadUrlResponse:
      type: object
      required:
        - event
        - videoUrl
        - uploadUrl
        - requiredHeaders
        - expiresAt
      properties:
        event:
          "$ref": "#/components/schemas/EventResponse"
        videoUrl:
          type: string
          format: uri
          description: >-
            Public object URL the video will be reachable at once uploaded. Not yet
            persisted on the event - pass it back to the video-upload-confirmation
            endpoint after the upload succeeds.
        uploadUrl:
          type: string
          format: uri
          description: Presigned S3 PUT URL the client uploads the video bytes to directly.
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
          description: >-
            Headers the client must send exactly as given on the PUT request, or
            the upload will fail signature validation.
        expiresAt:
          type: string
          format: date-time
    ConfirmVideoUploadRequest:
      type: object
      required:
        - videoUrl
        - contentType
        - fileSizeBytes
        - sha256
      properties:
        videoUrl:
          type: string
          format: uri
          description: >-
            The videoUrl previously returned by issueEventVideoUploadUrl, confirming
            the upload to that object completed successfully.
        contentType:
          type: string
          enum:
            - video/mp4
            - video/webm
            - video/quicktime
        fileSizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 104857600
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase hexadecimal SHA-256 checksum expected on the uploaded object.
      additionalProperties: false
