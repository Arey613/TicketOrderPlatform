---
openapi: 3.1.0
info:
  title: Ticket Service API
  version: 0.1.0
  description: API contract for the TicketOrderPlatform ticket service.
servers:
  - url: http://localhost:8080
    description: Local API server
tags:
  - name: Auth
    description: Registration, login, and logout resources
  - name: Users
    description: User resources
  - name: Events
    description: Event management and event order resources
paths:
  "/auth/csrf":
    get:
      operationId: getCsrfToken
      tags:
        - Auth
      summary: Create a CSRF token cookie
      responses:
        "204":
          description: CSRF token cookie was created
  "/auth/login":
    post:
      operationId: login
      tags:
        - Auth
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
  "/auth/register":
    post:
      operationId: registerUser
      tags:
        - Auth
      summary: Register a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Registration succeeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/auth/logout":
    post:
      operationId: logout
      tags:
        - Auth
      summary: Logout the current user
      responses:
        "204":
          description: Logout succeeded
  "/users/{userId}":
    get:
      operationId: getUser
      tags:
        - Users
      summary: Return a user
      security:
        - sessionAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/events":
    post:
      operationId: createEvent
      tags:
        - Events
      summary: Create an event
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event was created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
    get:
      operationId: listEvents
      tags:
        - Events
      summary: List events
      security:
        - sessionAuth: []
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            "$ref": "#/components/schemas/EventListScope"
      responses:
        "200":
          description: Events response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventListResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/events/{eventId}":
    get:
      operationId: getEvent
      tags:
        - Events
      summary: Return an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Event response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
    put:
      operationId: updateEvent
      tags:
        - Events
      summary: Update an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Event was updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/public/events":
    get:
      operationId: listPublishedEvents
      tags:
        - Events
      summary: List published events for public browsing
      responses:
        "200":
          description: Published events response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventListResponse"
  "/public/events/{eventId}":
    get:
      operationId: getPublishedEvent
      tags:
        - Events
      summary: Return a published event for public browsing
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Published event response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/events/{eventId}/publish":
    post:
      operationId: publishEvent
      tags:
        - Events
      summary: Publish an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Event was published
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/events/{eventId}/unpublish":
    post:
      operationId: unpublishEvent
      tags:
        - Events
      summary: Unpublish an event
      security:
        - sessionAuth: []
      parameters:
        - "$ref": "#/components/parameters/EventId"
      responses:
        "200":
          description: Event was unpublished
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EventResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/events/orders":
    post:
      operationId: createEventOrders
      tags:
        - Events
      summary: Create event orders
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateEventOrdersRequest"
      responses:
        "201":
          description: Event orders were created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedEventOrdersResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
    delete:
      operationId: deleteEventOrders
      tags:
        - Events
      summary: Delete event orders
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/DeleteEventOrdersRequest"
      responses:
        "204":
          description: Event orders were deleted
        "400":
          "$ref": "#/components/responses/BadRequest"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
  "/events/orders/mine":
    get:
      operationId: listMyEventOrders
      tags:
        - Events
      summary: List event orders for the current user
      security:
        - sessionAuth: []
      responses:
        "200":
          description: Event orders response
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MyEventOrdersResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
components:
  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request was invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication credentials are missing or invalid
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user is not allowed to perform this action
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource was not found
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ErrorResponse"
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
    RegisterUserRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginResponse:
      type: object
      required:
        - id
        - email
        - role
        - enabled
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 320
        role:
          "$ref": "#/components/schemas/UserRole"
        enabled:
          type: boolean
    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
        fieldErrors:
          type: array
          items:
            "$ref": "#/components/schemas/FieldErrorResponse"
        timestamp:
          type: string
          format: date-time
    FieldErrorResponse:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 200
        message:
          type: string
          minLength: 1
          maxLength: 500
    UserRole:
      type: string
      enum:
      - CUSTOMER
      - MANAGER
      - ADMIN
    EventStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - CANCELLED
    EventListScope:
      type: string
      default: published
      enum:
        - published
        - mine
    EventDetailsRequest:
      type: object
      required:
        - description
        - numberOfPlaces
        - numberOfRows
        - seatsPerRow
      properties:
        description:
          type: string
          minLength: 1
        numberOfPlaces:
          type: integer
          minimum: 1
        numberOfRows:
          type: integer
          minimum: 1
        seatsPerRow:
          type: integer
          minimum: 1
        placeTypes:
          type: array
          items:
            "$ref": "#/components/schemas/EventPlaceTypeRequest"
    EventDetailsResponse:
      allOf:
        - "$ref": "#/components/schemas/EventDetailsRequest"
        - type: object
          required:
            - availablePlaces
          properties:
            availablePlaces:
              type: integer
              minimum: 0
    EventPlaceTypeRequest:
      type: object
      required:
        - name
        - price
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,2})?$"
        currency:
          type: string
          minLength: 3
          maxLength: 3
    CreateEventRequest:
      type: object
      required:
        - name
        - date
        - place
        - type
        - details
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        date:
          type: string
          format: date-time
        place:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          maxLength: 120
        type:
          type: string
          minLength: 1
          maxLength: 100
        summary:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,2})?$"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        details:
          "$ref": "#/components/schemas/EventDetailsRequest"
      additionalProperties: false
    UpdateEventRequest:
      allOf:
        - "$ref": "#/components/schemas/CreateEventRequest"
    BookedPlaceResponse:
      type: object
      required:
        - row
        - place
      properties:
        row:
          type: integer
          minimum: 1
        place:
          type: integer
          minimum: 1
        isMine:
          type: boolean
          description: Present only when ownership is projected for an authenticated viewer.
        customerReference:
          type: string
          format: uuid
          description: Present only for manager or admin event-detail views when customer reference checking is allowed.
    EventResponse:
      type: object
      required:
        - eventId
        - ownerId
        - name
        - date
        - place
        - type
        - status
        - details
        - ordersTaken
        - availablePlaces
        - takenPlaces
      properties:
        eventId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 200
        date:
          type: string
          format: date-time
        place:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 120
        type:
          type: string
          maxLength: 100
        summary:
          type: string
          maxLength: 500
        imageUrl:
          type: string
          format: uri
        price:
          type: string
          pattern: "^\\d+(\\.\\d{1,2})?$"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          "$ref": "#/components/schemas/EventStatus"
        details:
          "$ref": "#/components/schemas/EventDetailsResponse"
        ordersTaken:
          type: integer
          minimum: 0
        availablePlaces:
          type: integer
          minimum: 0
        takenPlaces:
          type: array
          items:
            "$ref": "#/components/schemas/BookedPlaceResponse"
    EventListResponse:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          items:
            "$ref": "#/components/schemas/EventResponse"
    CreateEventOrderItem:
      type: object
      required:
        - eventId
        - row
        - place
        - placeType
      properties:
        eventId:
          type: string
          format: uuid
        row:
          type: integer
          minimum: 1
        place:
          type: integer
          minimum: 1
        placeType:
          type: string
          minLength: 1
          maxLength: 100
    CreateEventOrdersRequest:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/CreateEventOrderItem"
    CreatedEventOrderResponse:
      type: object
      required:
        - eventOrderId
        - eventId
        - row
        - place
        - placeType
        - reservationDate
      properties:
        eventOrderId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        row:
          type: integer
          minimum: 1
        place:
          type: integer
          minimum: 1
        placeType:
          type: string
          maxLength: 100
        reservationDate:
          type: string
          format: date-time
    CreatedEventOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/CreatedEventOrderResponse"
    DeleteEventOrdersRequest:
      type: object
      required:
        - eventOrderIds
      properties:
        eventOrderIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
    MyEventOrderResponse:
      type: object
      required:
        - eventOrderId
        - eventId
        - eventName
        - eventDate
        - row
        - place
        - placeType
        - reservationDate
      properties:
        eventOrderId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventName:
          type: string
          maxLength: 200
        eventDate:
          type: string
          format: date-time
        row:
          type: integer
          minimum: 1
        place:
          type: integer
          minimum: 1
        placeType:
          type: string
          maxLength: 100
        reservationDate:
          type: string
          format: date-time
    MyEventOrdersResponse:
      type: object
      required:
        - orders
      properties:
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/MyEventOrderResponse"
    UserResponse:
      type: object
      required:
      - id
      - email
      - role
      - enabled
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 320
        role:
          "$ref": "#/components/schemas/UserRole"
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
