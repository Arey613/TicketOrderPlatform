name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Makefile validations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/ticket-order-web/package-lock.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install web dependencies
        run: make install-web

      - name: Run tests
        run: make test

      - name: Verify build
        run: make verify

      # - name: Validate Docker Compose
      #   run: docker compose config
      #
      # - name: Build Docker images
      #   run: make docker-build
