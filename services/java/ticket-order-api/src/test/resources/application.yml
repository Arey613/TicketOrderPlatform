spring:
  profiles:
    active: local
  config:
    import:
      - classpath:observability-logging-test.yml
      - classpath:pagination-test.yml
  application:
    name: ticket-order-api
  datasource:
    primary:
      url: jdbc:h2:mem:ticket_order_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      username: sa
      password:
      driver-class-name: org.h2.Driver
    read-replica:
      url: jdbc:h2:mem:ticket_order_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
      username: sa
      password:
      driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true
    open-in-view: false
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ""

otel:
  service:
    name: ${spring.application.name}
  traces:
    exporter: none
  metrics:
    exporter: none
  logs:
    exporter: none
  propagators: tracecontext,baggage

ticket-order-platform:
  observability:
    correlation:
      header-name: X-Correlation-ID
      validation-pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}-\d{2}-\d{2}-\d{4}$'
      value-template: '{uuid}-{date:dd-MM-yyyy}'
      time-zone: UTC
      invalid-id-action: invalidate-session
      generate-when-missing: true
    metrics:
      enabled: true
      auth-metrics-enabled: true
