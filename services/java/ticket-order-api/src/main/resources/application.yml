server:
  port: 8080

spring:
  config:
    import:
      - classpath:observability-logging.yml
  application:
    name: ticket-order-api
  datasource:
    primary:
      url: ${SPRING_DATASOURCE_PRIMARY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_order}}
      username: ${SPRING_DATASOURCE_PRIMARY_USERNAME:${SPRING_DATASOURCE_USERNAME:ticket_order}}
      password: ${SPRING_DATASOURCE_PRIMARY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:ticket_order}}
    read-replica:
      url: ${SPRING_DATASOURCE_READ_REPLICA_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket_order}}
      username: ${SPRING_DATASOURCE_READ_REPLICA_USERNAME:${SPRING_DATASOURCE_USERNAME:ticket_order}}
      password: ${SPRING_DATASOURCE_READ_REPLICA_PASSWORD:${SPRING_DATASOURCE_PASSWORD:ticket_order}}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: ${TICKET_ORDER_MEDIA_IMAGE_MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${TICKET_ORDER_MEDIA_IMAGE_MAX_REQUEST_SIZE:6MB}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  propagators: ${OTEL_PROPAGATORS:tracecontext,baggage}

ticket-order-platform:
  observability:
    correlation:
      header-name: X-Correlation-ID
      validation-pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}-\d{2}-\d{2}-\d{4}$'
      value-template: '{uuid}-{date:dd-MM-yyyy}'
      time-zone: ${TICKET_ORDER_CORRELATION_TIME_ZONE:UTC}
      invalid-id-action: invalidate-session
      generate-when-missing: true
    metrics:
      enabled: ${TICKET_ORDER_METRICS_ENABLED:true}
      auth-metrics-enabled: ${TICKET_ORDER_AUTH_METRICS_ENABLED:true}
      event-media-metrics-enabled: ${TICKET_ORDER_EVENT_MEDIA_METRICS_ENABLED:true}
  storage:
    s3:
      bucket: ${TICKET_ORDER_STORAGE_S3_BUCKET:ticket-order-event-media}
      region: ${TICKET_ORDER_STORAGE_S3_REGION:us-east-1}
      endpoint: ${TICKET_ORDER_STORAGE_S3_ENDPOINT:}
      presign-endpoint: ${TICKET_ORDER_STORAGE_S3_PRESIGN_ENDPOINT:}
      path-style-access: ${TICKET_ORDER_STORAGE_S3_PATH_STYLE_ACCESS:false}
      public-base-url: ${TICKET_ORDER_STORAGE_S3_PUBLIC_BASE_URL:https://ticket-order-event-media.s3.us-east-1.amazonaws.com}
      presign-ttl: ${TICKET_ORDER_STORAGE_S3_PRESIGN_TTL:15m}
  media:
    image:
      max-size-bytes: ${TICKET_ORDER_MEDIA_IMAGE_MAX_SIZE_BYTES:5242880}
      allowed-content-types:
        - image/jpeg
        - image/png
        - image/webp
      cache-control: ${TICKET_ORDER_MEDIA_IMAGE_CACHE_CONTROL:public, max-age=3600}
    video:
      max-size-bytes: ${TICKET_ORDER_MEDIA_VIDEO_MAX_SIZE_BYTES:52428800}
      allowed-content-types:
        - video/mp4
        - video/webm
        - video/quicktime
      cache-control: ${TICKET_ORDER_MEDIA_VIDEO_CACHE_CONTROL:public, max-age=3600}
  cors:
    allowed-origins:
      - http://localhost:5173
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600
