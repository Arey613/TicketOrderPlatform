services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ticket_order
      POSTGRES_USER: ticket_order
      POSTGRES_PASSWORD: ticket_order
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_order -d ticket_order"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    image: ticket-order-api
    build:
      context: .
      dockerfile: services/java/ticket-order-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket_order
      SPRING_DATASOURCE_USERNAME: ticket_order
      SPRING_DATASOURCE_PASSWORD: ticket_order
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ticket-order-web
    build:
      context: .
      dockerfile: apps/web/ticket-order-web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
