services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ticket_order
      POSTGRES_USER: ticket_order
      POSTGRES_PASSWORD: ticket_order
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_order -d ticket_order"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql

  transactional-migrations:
    image: ticket-order-transactional-migrations
    build:
      context: .
      dockerfile: database/java/migrations/ticket-order-db-migrations/Dockerfile
      args:
        MIGRATION_MODULE_PATH: database/java/migrations/ticket-order-db-migrations/ticket-order-transactional-migrations
        MIGRATION_PROFILE: transactional
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ticket_order
      FLYWAY_USER: ticket_order
      FLYWAY_PASSWORD: ticket_order
    depends_on:
      postgres:
        condition: service_healthy

  analytical-migrations:
    image: ticket-order-analytical-migrations
    build:
      context: .
      dockerfile: database/java/migrations/ticket-order-db-migrations/Dockerfile
      args:
        MIGRATION_MODULE_PATH: database/java/migrations/ticket-order-db-migrations/ticket-order-analytical-migrations
        MIGRATION_PROFILE: analytical
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/ticket_order
      FLYWAY_USER: ticket_order
      FLYWAY_PASSWORD: ticket_order
    depends_on:
      postgres:
        condition: service_healthy
      transactional-migrations:
        condition: service_completed_successfully

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  api:
    image: ticket-order-api
    build:
      context: .
      dockerfile: services/java/ticket-order-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:postgresql://postgres:5432/ticket_order
      SPRING_DATASOURCE_PRIMARY_USERNAME: ticket_order
      SPRING_DATASOURCE_PRIMARY_PASSWORD: ticket_order
      SPRING_DATASOURCE_READ_REPLICA_URL: jdbc:postgresql://postgres:5432/ticket_order
      SPRING_DATASOURCE_READ_REPLICA_USERNAME: ticket_order
      SPRING_DATASOURCE_READ_REPLICA_PASSWORD: ticket_order
      TICKET_ORDER_STORAGE_S3_ENDPOINT: http://localstack:4566
      # Presigned URLs and public object URLs are handed to the browser running on the host,
      # which cannot resolve the "localstack" Docker network hostname - only the host-published
      # port is reachable from there. Server-side calls (bucket-ensure, image upload) run inside
      # this container and use TICKET_ORDER_STORAGE_S3_ENDPOINT above instead.
      TICKET_ORDER_STORAGE_S3_PRESIGN_ENDPOINT: http://localhost:4566
      TICKET_ORDER_STORAGE_S3_PUBLIC_BASE_URL: http://localhost:4566/ticket-order-event-media
      TICKET_ORDER_STORAGE_S3_BUCKET: ticket-order-event-media
      TICKET_ORDER_STORAGE_S3_REGION: us-east-1
      TICKET_ORDER_STORAGE_S3_PATH_STYLE_ACCESS: "true"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      transactional-migrations:
        condition: service_completed_successfully
      analytical-migrations:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy

  web:
    image: ticket-order-web
    build:
      context: .
      dockerfile: apps/web/ticket-order-web/Dockerfile
      args:
        VITE_TICKET_API_BASE_URL: ${VITE_TICKET_API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres-data:
